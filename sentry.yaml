ellipsis:
  kind: sentry
  name: production-errors

sentry:
  projects: ['*']
  on: [issue_alert, metric_alert]

session:
  claude_code:
    model: claude-opus-5-5
    prompt: |
      Investigate the alert and send one report to #eng-ops with the
      project, Sentry link, impact, and next step. Link the causing
      pull request only when the evidence supports it.
  environment:
    repositories:
      - name: A1
      - name: Aperture
      - name: Aperturev1
      - name: Aperturev2
      - name: Auxio
      - name: Call
      - name: Comet
      - name: Compiler
      - name: Editor
      - name: GPT-4-LLM
      - name: H1-Concept-by-TJ
      - name: HI-by-TJ
      - name: ICON
      - name: MyFirstApp
      - name: OpenBrowser
      - name: OpenMuse
      - name: Oracle-Eager
      - name: P2P
      - name: Pdf--viewer
      - name: ProjectVelo
      - name: Radio
      - name: ReadYou
      - name: Velo
      - name: Xcode
      - name: client-sdk-android
      - name: jiosaavn-api
      - name: mj_pdf
      - name: peer
      - name: peercall
      - name: search
      - name: simpleeditor
    mcp_servers:
      - name: slack
  permissions:
    github:
      permissions: read_only
  budget:
    session: 2

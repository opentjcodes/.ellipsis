ellipsis:
  kind: agent
  name: dependency-upgrades

trigger:
  type: cron
  schedule: '0 9 * * 1'

session:
  claude_code:
    model: claude-opus-5-5
    prompt: |
      In each repository, upgrade outdated dependencies to their latest
      minor and patch versions. Run the tests, fix what breaks, and open
      one pull request per repository that lists each upgrade.
  environment: all-repositories
  permissions:
    github:
      repositories: [A1, Aperture, Aperturev1, Aperturev2, Auxio, Call, Comet, Compiler, Editor, GPT-4-LLM, H1-Concept-by-TJ, HI-by-TJ, ICON, MyFirstApp, OpenBrowser, OpenMuse, Oracle-Eager, P2P, Pdf--viewer, ProjectVelo, Radio, ReadYou, Velo, Xcode, client-sdk-android, jiosaavn-api, mj_pdf, peer, peercall, search, simpleeditor]
      permissions:
        contents: write
        pull_requests: write
  budget:
    session: 10

ellipsis:
  kind: agent
  name: code-review

trigger:
  type: react
  pull_request:
    on: [pushed]
    repositories: [A1, Aperture, Aperturev1, Aperturev2, Auxio, Call, Comet, Compiler, Editor, GPT-4-LLM, H1-Concept-by-TJ, HI-by-TJ, ICON, MyFirstApp, OpenBrowser, OpenMuse, Oracle-Eager, P2P, Pdf--viewer, ProjectVelo, Radio, ReadYou, Velo, Xcode, client-sdk-android, jiosaavn-api, mj_pdf, peer, peercall, search, simpleeditor]
    draft: false

session:
  claude_code:
    model: claude-opus-5-5
    prompt: |
      Find bugs in this pull request. Post one review with `gh`
      and comment on the line of each bug. Post nothing if you
      find no bugs or if newer commits arrived.
  environment: all-repositories
  permissions:
    github:
      permissions:
        contents: read
        pull_requests: write
  budget:
    session: 3
